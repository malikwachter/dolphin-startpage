name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            deps: pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules qt6-base kio kwidgetsaddons kconfig kcoreaddons solid
          - distro: fedora
            image: fedora:latest
            deps: dnf install -y gcc-c++ cmake extra-cmake-modules qt6-qtbase-devel kf6-kio-devel kf6-kwidgetsaddons-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-solid-devel
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/pkg" cmake --install build
          tar czf dolphin-startpage-${{ matrix.distro }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}
          path: dolphin-startpage-${{ matrix.distro }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -oP 'project\(dolphin-startpage VERSION \K[0-9.]+' CMakeLists.txt)"
          TAG="v${VERSION}-build${{ github.run_number }}"
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## Changes"
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --no-merges --pretty='- %s (%h)'
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
            echo
            echo "Install: \`sudo tar xzf dolphin-startpage-<distro>.tar.gz -C /\`, then restart Dolphin."
          } > CHANGELOG.md
          git archive --format=tar.gz --prefix=dolphin-startpage/ -o dist/dolphin-startpage-source.tar.gz HEAD
          for d in arch fedora; do
            mv "dist/dolphin-startpage-$d.tar.gz" "dist/dolphin-startpage-${VERSION}-$d.tar.gz"
          done
          gh release create "$TAG" dist/*.tar.gz --title "dolphin-startpage $TAG" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
